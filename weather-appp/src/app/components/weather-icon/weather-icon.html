<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 40 40"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  class="wicon"
>
  @switch (glyph()) {
    @case ('clear-day') {
      <g>
        <circle cx="20" cy="20" r="8" class="sun-core" />
        <g class="sun-rays">
          <line x1="20" y1="2" x2="20" y2="7" />
          <line x1="20" y1="33" x2="20" y2="38" />
          <line x1="2" y1="20" x2="7" y2="20" />
          <line x1="33" y1="20" x2="38" y2="20" />
          <line x1="7.5" y1="7.5" x2="11" y2="11" />
          <line x1="29" y1="29" x2="32.5" y2="32.5" />
          <line x1="7.5" y1="32.5" x2="11" y2="29" />
          <line x1="29" y1="11" x2="32.5" y2="7.5" />
        </g>
      </g>
    }

    @case ('clear-night') {
      <g>
        <path d="M27 8a13 13 0 1 0 5 21 11 11 0 0 1-5-21Z" class="moon" />
        <circle cx="12" cy="10" r="1.2" class="star" />
        <circle cx="8" cy="18" r="0.9" class="star" />
        <circle cx="15" cy="17" r="0.7" class="star" />
      </g>
    }

    @case ('partly-day') {
      <g>
        <circle cx="14" cy="14" r="6" class="sun-core" />
        <path
          d="M11 30h16a6 6 0 0 0 1-11.9A9 9 0 0 0 11 22a5.5 5.5 0 0 0 0 8Z"
          class="cloud"
        />
      </g>
    }

    @case ('partly-night') {
      <g>
        <path d="M23 6a10 10 0 0 0 3 18 8.5 8.5 0 0 1-3-18Z" class="moon" />
        <path
          d="M9 30h16a6 6 0 0 0 1-11.9A9 9 0 0 0 9 22a5.5 5.5 0 0 0 0 8Z"
          class="cloud"
        />
      </g>
    }

    @case ('cloudy') {
      <path
        d="M8 28h22a6.5 6.5 0 0 0 1-12.9A10 10 0 0 0 11 19a6 6 0 0 0-3 9Z"
        class="cloud"
      />
    }

    @case ('rain') {
      <g>
        <path
          d="M8 22h22a6.5 6.5 0 0 0 1-12.9A10 10 0 0 0 11 13a6 6 0 0 0-3 9Z"
          class="cloud"
        />
        <g class="drops">
          <line x1="14" y1="30" x2="12" y2="36" />
          <line x1="20" y1="30" x2="18" y2="36" />
          <line x1="26" y1="30" x2="24" y2="36" />
        </g>
      </g>
    }

    @case ('snow') {
      <g>
        <path
          d="M8 20h22a6.5 6.5 0 0 0 1-12.9A10 10 0 0 0 11 11a6 6 0 0 0-3 9Z"
          class="cloud"
        />
        <g class="flakes">
          <circle cx="13" cy="32" r="1.4" />
          <circle cx="20" cy="35" r="1.4" />
          <circle cx="27" cy="32" r="1.4" />
        </g>
      </g>
    }

    @case ('thunder') {
      <g>
        <path
          d="M8 18h22a6.5 6.5 0 0 0 1-12.9A10 10 0 0 0 11 9a6 6 0 0 0-3 9Z"
          class="cloud"
        />
        <path d="M21 22l-6 9h5l-3 7 9-10h-5l3-6Z" class="bolt" />
      </g>
    }

    @case ('fog') {
      <g>
        <path
          d="M10 16h20a6 6 0 0 0 0.5-11.9A9 9 0 0 0 12 8a5.5 5.5 0 0 0-2 8Z"
          class="cloud"
        />
        <line x1="6" y1="26" x2="34" y2="26" class="fog-line" />
        <line x1="9" y1="31" x2="31" y2="31" class="fog-line" />
        <line x1="12" y1="36" x2="28" y2="36" class="fog-line" />
      </g>
    }

    @case ('wind') {
      <g>
        <path d="M4 14h20a4 4 0 1 0-3-6.6" class="wind-line" />
        <path d="M4 22h26a4.2 4.2 0 1 1-3 7" class="wind-line" />
        <path d="M4 30h16a3.2 3.2 0 1 1-2.4 5.3" class="wind-line" />
      </g>
    }
  }
</svg>
