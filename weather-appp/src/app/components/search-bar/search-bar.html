<form class="search-row" (ngSubmit)="onSubmit()">
  <div class="input-wrap">
    <svg class="pin" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path
        d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22Z"
        stroke="currentColor"
        stroke-width="1.6"
      />
      <circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6" />
    </svg>
    <input
      type="text"
      name="location"
      placeholder="Search a city, zip, or place…"
      [(ngModel)]="query"
      autocomplete="off"
    />
  </div>

  <button
    type="button"
    class="icon-btn"
    title="Use my current location"
    (click)="useMyLocation.emit()"
    [disabled]="isLoading()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="3" fill="currentColor" />
      <path
        d="M12 2v3M12 19v3M22 12h-3M5 12H2"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <button
    type="button"
    class="icon-btn"
    [class.spinning]="isLoading()"
    title="Refresh"
    (click)="refresh.emit()"
    [disabled]="isLoading()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path
        d="M4 10a8 8 0 0 1 13.9-5.3M20 14a8 8 0 0 1-13.9 5.3"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
      <path d="M18 3v5h-5M6 21v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  </button>

  <button type="submit" class="go-btn" [disabled]="isLoading()">Search</button>
</form>
