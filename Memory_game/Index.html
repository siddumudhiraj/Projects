<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Memory Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated starfield background -->
  <canvas id="starfield"></canvas>

  <!-- Floating orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="app-wrapper">

    <header class="site-header">
      <div class="pokeball-icon">
        <div class="pokeball-top"></div>
        <div class="pokeball-middle"><div class="pokeball-btn"></div></div>
        <div class="pokeball-bottom"></div>
      </div>
      <div class="header-text">
        <h1 class="heading">Pokémon<br><span>Memory</span> Challenge</h1>
        <p class="subtitle">Test your trainer instincts</p>
      </div>
    </header>

    <div class="hud">
      <div class="hud-card">
        <span class="hud-label">Attempts</span>
        <span class="hud-value count">0</span>
      </div>
      <div class="hud-center">
        <button class="reset-btn" id="resetBtn">
          <svg class="reset-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          Reset
        </button>
      </div>
      <div class="hud-card">
        <span class="hud-label">Time</span>
        <span class="hud-value"><span class="min-count">00</span>:<span class="sec-count">00</span></span>
      </div>
    </div>

    <div id="game"></div>

    <!-- Win overlay -->
    <div class="win-overlay" id="winOverlay">
      <div class="win-card">
        <div class="win-trophy">🏆</div>
        <h2>You caught 'em all!</h2>
        <p>Finished in <strong class="win-time"></strong> with <strong class="win-attempts"></strong> attempts</p>
        <button class="play-again-btn" id="playAgainBtn">Play Again</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
